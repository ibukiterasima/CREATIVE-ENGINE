</style></head><body><div id="app"></div><script>
(()=>{'use strict';const studios={game:{name:'Game Studio',ja:'ゲーム',prefix:'g',icon:'◉',desc:'遊びのアイデアを、動くゲームに。'},animation:{name:'Animation Studio',ja:'アニメーション',prefix:'a',icon:'✳',desc:'動きとストーリーを、ひとつの作品に。'},web:{name:'Web Studio',ja:'ウェブサイト',prefix:'w',icon:'▧',desc:'伝えたいことを、美しいWebサイトに。'},logic:{name:'Logic Studio',ja:'ロジック',prefix:'p',icon:'⌘',desc:'アイデアをつないで、仕組みにする。'}};const demo=[];let projects;try{projects=JSON.parse(localStorage.getItem('ce.projects'))||[]}catch{projects=[]}const sampleNames=['星降る夜の冒険','MORI COFFEE','小さな春','おみくじメーカー'];if(projects.some(p=>['1','2','3','4','demo-game','demo-web','demo-animation','demo-logic'].includes(p.id)&&sampleNames.includes(p.name))){projects=projects.filter(p=>!(['1','2','3','4','demo-game','demo-web','demo-animation','demo-logic'].includes(p.id)&&sampleNames.includes(p.name)));localStorage.setItem('ce.projects',JSON.stringify(projects))}let assets;try{assets=JSON.parse(localStorage.getItem('ce.assets'))||[]}catch{assets=[]}let page='dashboard',language='ja',studio='game',activeId=null,chosen='game',mode='easy',query='',toastTimer;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),url=p=>`https://creative-engine.com/${studios[p.studio].prefix}/${p.slug}`,save=()=>localStorage.setItem('ce.projects',JSON.stringify(projects)),say=s=>{let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.append(el)}el.textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),1900)},rnd=()=>Math.random().toString(36).slice(2,10),pname=p=>language==='ja'?studios[p].ja:studios[p].name;function render(){let p=projects.find(x=>x.id===activeId);let title=page==='dashboard'?'ダッシュボード':page==='projects'?'マイプロジェクト':page==='publish'?'公開管理':page==='settings'?'設定':page==='studio'?(p?.name||studios[studio].name):'アセットライブラリ';$('#app').innerHTML=`<aside class="side"><div class="brand"><i class="mark"><i></i><i></i><i></i><i></i></i><span class="brandtext">CREATIVE<small>ENGINE</small></span></div><div class="navlabel">WORKSPACE</div><button class="nav ${page==='dashboard'?'active':''}" data-page="dashboard"><span>▦</span><b class="navtext">ダッシュボード</b></button><button class="nav ${page==='projects'?'active':''}" data-page="projects"><span>▤</span><b class="navtext">マイプロジェクト</b></button><div class="navlabel">STUDIOS</div>${Object.keys(studios).map(s=>`<button class="nav ${page==='studio'&&studio===s?'active':''}" data-studio="${s}"><span>${studios[s].icon}</span><b class="navtext">${studios[s].name}</b></button>`).join('')}<div class="navlabel">MANAGE</div><button class="nav ${page==='publish'?'active':''}" data-page="publish"><span>↗</span><b class="navtext">公開管理</b></button><button class="nav" data-page="assets"><span>▣</span><b class="navtext">アセットライブラリ</b></button><div class="side-bottom"><button class="nav" data-page="settings"><span>⚙</span><b class="navtext">設定</b></button><div class="profile"><i class="avatar">A</i><div class="profiletext">Alex Morgan<small>Local demo</small></div></div></div></aside><main class="main"><header class="top"><span class="crumb">${esc(title)}</span><div class="topright"><input class="search" id="search" placeholder="プロジェクトを検索…" value="${esc(query)}"><button class="plain" id="lang">${language==='ja'?'EN':'日本語'}</button><span class="avatar">A</span></div></header><div class="content">${page==='dashboard'?dashboard():page==='projects'?projectsPage():page==='publish'?publishPage():page==='studio'?(p?editor(p):studioPage()):page==='settings'?settingsPage():assetsPage()}</div><footer class="footer"><span>© 2025 CREATIVE ENGINE</span><span>● LOCAL DEMO　·　ALL SYSTEMS READY</span></footer></main>`;bind()}
function card(p){return `<article class="project" data-open="${p.id}"><div class="cover ${p.studio}">${studios[p.studio].icon}</div><div class="pinfo"><b>${esc(p.name)}</b><small><span>${pname(p.studio)} · ${p.published?'公開中':'下書き'}</span><span>◉ ${p.views}</span></small></div></article>`}
function dashboard(){return `<section class="hero"><div class="eyebrow">✦ YOUR CREATIVE SPACE</div><h1>おかえりなさい、<em>Alex</em></h1><p>アイデアを、かたちにしよう。</p><button class="primary" data-create>＋　新しい作品をつくる　→</button><div class="heroart"><div class="poster">MAKE<br>SOMETHING<br><b>MATTERS.</b></div><div class="note">a little space<br>for big ideas ↗</div></div></section><div class="stats"><div class="stat"><span>プロジェクト</span><b>${projects.length}</b></div><div class="stat"><span>公開中</span><b>${projects.filter(p=>p.published).length}</b></div><div class="stat"><span>合計ビュー</span><b>${projects.reduce((n,p)=>n+p.views,0).toLocaleString()}</b></div><div class="stat"><span>すぐに制作</span><button data-create>＋ 新規プロジェクト</button></div></div><section class="section"><div class="sectionhead"><div><div class="muted">MAKE SOMETHING</div><h2>制作をはじめる</h2></div><span class="muted">01 / 04</span></div><div class="studios">${Object.entries(studios).map(([s,v])=>`<button class="studiocard ${s}" data-create-studio="${s}"><span class="sicon">${v.icon}</span><div><b>${v.name.toUpperCase()}</b><small>${v.desc}</small></div><footer>新規プロジェクト　↗</footer></button>`).join('')}</div></section><section class="section"><div class="sectionhead"><div><div class="muted">PICK UP WHERE YOU LEFT OFF</div><h2>最近のプロジェクト</h2></div><button class="plain" data-page="projects">すべて見る　→</button></div><div class="cards">${projects.slice(0,3).map(card).join('')||'<div class="empty">プロジェクトがありません</div>'}</div></section>`}
function studioPage(){let list=projects.filter(p=>p.studio===studio&&p.name.toLowerCase().includes(query.toLowerCase()));return '<div class="pagehead"><div><div class="muted">'+studios[studio].name.toUpperCase()+'</div><h1>'+studios[studio].name+'</h1><p>'+studios[studio].desc+'</p></div><button class="primary" data-create-studio="'+studio+'">＋ 新しい作品</button></div><div class="cards">'+(list.map(card).join('')||'<div class="empty">このスタジオにはまだ作品がありません。上のボタンから作成できます。</div>')+'</div>'}
function projectsPage(){let list=projects.filter(p=>p.name.toLowerCase().includes(query.toLowerCase()));return `<div class="pagehead"><div><div class="muted">YOUR LIBRARY</div><h1>マイプロジェクト</h1><p>すべての作品をひとつの場所で管理。</p></div><button class="primary" data-create>＋ 新しい作品</button></div><div class="cards">${list.map(card).join('')||'<div class="empty">プロジェクトがありません</div>'}</div>`}
function publishPage(){return `<div class="pagehead"><div><div class="muted">SHARE YOUR CREATION</div><h1>公開管理</h1><p>作品の公開URL、ID、公開範囲を設定します。</p></div><span class="muted">creative-engine.com</span></div><div class="tablebox"><table><thead><tr><th>作品</th><th>スタジオ</th><th>URL / 作品ID</th><th>公開範囲</th><th>状態</th><th>操作</th></tr></thead><tbody>${projects.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${studios[p.studio].ja}</td><td><span class="prefix">/${studios[p.studio].prefix}/</span><input class="slug" data-slug="${p.id}" value="${esc(p.slug)}" maxlength="50" aria-label="作品ID"><span class="smallurl">${esc(url(p).replace('https://',''))}</span></td><td><select data-visibility="${p.id}"><option value="public" ${p.visibility==='public'?'selected':''}>公開</option><option value="unlisted" ${p.visibility==='unlisted'?'selected':''}>限定公開</option><option value="private" ${p.visibility==='private'?'selected':''}>非公開</option></select></td><td>${p.published?'公開中':'下書き'}</td><td><div class="actions"><button data-auto="${p.id}">自動ID</button><button data-publish="${p.id}">${p.published?'停止':'公開'}</button><button data-copy="${p.id}">URLコピー</button><button data-edit="${p.id}">編集</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">プロジェクトがありません</td></tr>'}</tbody></table></div><p class="notice">限定公開はURLを知っている人が閲覧できます。非公開は一般向けページに表示しない設定です。IDは小文字英数字とハイフン（1〜50文字）。</p>`}
